<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>도트 스킬 이펙트</title>
<style>
:root{--bg:#0d0f14;--panel:#171a22;--line:#2a2f3c;--ink:#e8e6df;--sub:#9aa0ad}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif}
.wrap{max-width:1440px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-left,0px)) 20px max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:10px}
h1{font-size:1.15rem;margin:0}
header p{margin:0;color:var(--sub);font-size:.85rem}
.stage{position:relative;display:flex;justify-content:center;background:#000;border:1px solid var(--line);border-radius:8px;overflow:hidden}
canvas{display:block;image-rendering:pixelated}
.cap{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(10,12,18,.82);border:1px solid var(--line);border-radius:6px;padding:6px 14px;text-align:center;pointer-events:none}
.cap b{display:block;font-size:1rem}
.cap span{font-size:.78rem;color:var(--sub)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.bar .grp{display:flex;flex-wrap:wrap;gap:6px}
button{min-height:40px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:.88rem;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
button[aria-pressed="true"]{border-color:#e8e6df;background:#2a2f3c}
button:focus-visible{outline:2px solid #ffe27a;outline-offset:2px}
.chip{width:12px;height:12px;border-radius:3px;display:inline-block}
.sep{width:1px;height:28px;background:var(--line);margin:0 4px}
</style></head><body><div class="wrap">
<header><h1>도트 스킬 이펙트 연습장</h1><p>스킬을 누르면 바로 씁니다. 단계가 오를수록 이펙트가 커지고 세집니다.</p></header>
<div class="stage" id="stage"><canvas id="cv"></canvas><div class="cap"><b id="capName"></b><span id="capDesc"></span></div></div>
<div class="bar"><div class="grp" id="skills"></div></div>
<div class="bar">
 <div class="grp" id="tiers"></div><span class="sep"></span>
 <div class="grp"><button id="glowBtn" aria-pressed="true">빛 번짐 켜짐</button><button id="autoBtn" aria-pressed="true">자동 재생 켜짐</button></div>
</div></div>
<script>
'use strict';
const W=320,H=180;
const cv=document.getElementById('cv'),dc=cv.getContext('2d');
const base=document.createElement('canvas');base.width=W;base.height=H;const bc=base.getContext('2d');
const glowC=document.createElement('canvas');glowC.width=W;glowC.height=H;const gc=glowC.getContext('2d');
const bImg=bc.createImageData(W,H),gImg=gc.createImageData(W,H);
const B=new Uint32Array(bImg.data.buffer),G=new Uint32Array(gImg.data.buffer);
const hex=h=>{const n=parseInt(h.slice(1),16);return ((255<<24)|((n&255)<<16)|(n&0xff00)|(n>>16))>>>0};
// 문파(색 묶음): 어두움 → 밝음 5단
const PAL={
 fire:['#3b0a02','#8c1d04','#e0520c','#ffa53a','#fff1b8'],
 crimson:['#2a0412','#7a0b2c','#d4234e','#ff7aa0','#ffe1ea'],
 ocean:['#04163a','#0b4a8f','#1f9be0','#7fe3ff','#f0ffff'],
 gold:['#2e1c02','#7a5206','#d9a21b','#ffe27a','#fffbe0'],
 void:['#14062e','#41168a','#8a4bf0','#c9a8ff','#f6efff'],
 jade:['#062a10','#13702c','#3fd04f','#b4ff7a','#f4ffe0'],
 yin:['#050507','#26262c','#8a8a94','#dcdce4','#ffffff'],
 ice:['#061a2e','#16507a','#3aa6d6','#a6ecff','#ffffff']};
const P={};for(const k in PAL)P[k]=PAL[k].map(hex);
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ease=t=>1-Math.pow(1-t,3);
const hash=(x,y,s)=>{let h=(x*374761393+y*668265263+s*1442695041)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296};
let frame=0;
function put(x,y,c,glow){x|=0;y|=0;if(x<0||y<0||x>=W||y>=H)return;const i=y*W+x;B[i]=c;if(glow)G[i]=c}
// 세기(0~1)를 도트 색 단계로 바꿔 찍는다. 밝은 두 단계만 빛 번짐에 넣는다(고른 빛)
function shade(x,y,v,pal){if(v<=0)return;const q=v*5+(BAY[(x&3)+((y&3)<<2)]/16-.5)*.55;if(q<.65)return;const i=clamp(q|0,0,4);put(x,y,pal[i],i>=3)}
function field(cx,cy,R,sy,pal,fn){const x0=Math.max(0,cx-R|0),x1=Math.min(W-1,cx+R|0),y0=Math.max(0,cy-R*sy|0),y1=Math.min(H-1,cy+R*sy|0);
 for(let y=y0;y<=y1;y++){const dy=(y-cy)/sy;for(let x=x0;x<=x1;x++){const dx=x-cx,d=Math.hypot(dx,dy);if(d>R)continue;const v=fn(d,Math.atan2(dy,dx),dx,dy,x,y);if(v>0)shade(x,y,v,pal)}}}
// ── 바닥 ──
const ground=new Uint32Array(W*H);
(function(){for(let y=0;y<H;y++)for(let x=0;x<W;x++){const n=hash(x>>2,y>>2,7),m=hash(x,y,3);let c=n<.5?'#1a1d24':'#1d2028';if(m>.985)c='#262a33';if(m<.006)c='#2b3a2a';ground[y*W+x]=hex(c)}})();
// ── 숫자 도트 글꼴(3x5) ──
const DG=['111101101101111','010110010010111','111001111100111','111001111001111','101101111001001','111100111001111','111100111101111','111001010010010','111101111101111','111101111001111'];
const BLACK=hex('#000000'),WHITE=hex('#ffffff'),YEL=hex('#ffd34d'),SHD=hex('#0a0b0f');
function digits(n,x,y,c){const s=String(n);for(let k=0;k<s.length;k++){const g=DG[+s[k]];for(let i=0;i<15;i++)if(g[i]==='1'){const px=x+k*4+i%3,py=y+(i/3|0);put(px+1,py+1,BLACK);put(px,py,c,true)}}}
// ── 사람·괴물 ──
const hero={x:96,y:104,lean:0};
const SK={hero:['....aa....','...aaaa...','...bccb...','..dddddd..','.ddeddedd.','..dddddd..','..ff..ff..','..ff..ff..'],
mob:['..g....g..','..gggggg..','.ghggghgg.','..gggggg..','.iigiigii.','..gggggg..','..jj..jj..','..j....j..']};
const SC={a:'#2b2b33',b:'#f0c8a0',c:'#20202a',d:'#e8e6df',e:'#3a7bd5',f:'#4a4a55',g:'#5a1f1f',h:'#ffd34d',i:'#8a2f2f',j:'#2a1010'};
for(const k in SC)SC[k]=hex(SC[k]);
function sprite(s,x,y,flash,flip){for(let r=0;r<s.length;r++)for(let c=0;c<10;c++){const ch=s[r][flip?9-c:c];if(ch!=='.')put(x-5+c,y-8+r,flash?WHITE:SC[ch],flash)}}
function shadow(x,y){for(let dx=-4;dx<=4;dx++)for(let dy=0;dy<2;dy++)if(Math.abs(dx)<4||dy===0)put(x+dx,y+dy,SHD)}
const mobs=[];function spawnMob(){mobs.push({x:150+Math.random()*165,y:40+Math.random()*125,vx:0,vy:0,flash:0,hx:0,hy:0,seed:Math.random()*99,hitBy:0})}
for(let i=0;i<34;i++)spawnMob();for(const m of mobs){m.hx=m.x;m.hy=m.y}
const nums=[],parts=[];let fx=[],shake=0;
function hitArea(id,test,dmg,push,cx,cy){for(const m of mobs){if(m.hitBy===id)continue;if(test(m)){m.hitBy=id;m.flash=7;const a=Math.atan2(m.y-cy,m.x-cx);m.vx+=Math.cos(a)*push;m.vy+=Math.sin(a)*push*.6;nums.push({x:m.x-4,y:m.y-14,v:Math.round(dmg*(.85+Math.random()*.3)),life:40,crit:Math.random()<.2})}}}
function spark(x,y,vx,vy,life,pal,grav){parts.push({x,y,vx,vy,life,max:life,pal,grav:grav||0})}
// ── 스킬 8개: 모양 갈래(폭발·베기·파도·장판·날붙이·문양·고리)마다 자기 생애가 있다 ──
const SKILLS=[
{name:'화룡장',desc:'손바닥에서 불꽃이 크게 터지는 폭발',pal:'fire',kind:'burst',dur:56},
{name:'홍련검',desc:'붉은 초승달로 앞을 베는 칼질',pal:'crimson',kind:'slash',dur:30},
{name:'단해',desc:'푸른 파도가 앞으로 밀고 나가는 기술',pal:'ocean',kind:'wave',dur:60},
{name:'금륜진',desc:'금빛 고리 장판이 돌며 여러 번 때리는 기술',pal:'gold',kind:'field',dur:110},
{name:'자월참',desc:'보랏빛 초승달로 한 바퀴 도는 회전 베기',pal:'void',kind:'spin',dur:34},
{name:'취엽비',desc:'초록 잎 칼날이 날아가 터지는 기술',pal:'jade',kind:'shot',dur:64},
{name:'태극인',desc:'태극 문양이 펼쳐졌다가 조각나 흩어지는 기술',pal:'yin',kind:'taiji',dur:80},
{name:'빙륜',desc:'얼음 고리가 퍼지며 땅에서 얼음 가시가 솟는 기술',pal:'ice',kind:'ice',dur:58}];
let cur=0,tier=2,glowOn=true,auto=true,autoT=0,idc=1;
function cast(i){cur=i;const s=SKILLS[i];fx.push({...s,t:0,x:hero.x+10,y:hero.y-4,tier,id:idc++});hero.lean=6;
 document.getElementById('capName').textContent=s.name+' · '+tier+'단계';document.getElementById('capDesc').textContent=s.desc;
 document.querySelectorAll('#skills button').forEach((b,k)=>b.setAttribute('aria-pressed',k===i));}
function runFx(e){const p=P[e.pal],T=e.tier,u=e.t/e.dur,k=1.25+(T-1)*.25,f=frame;
 switch(e.kind){
 case'burst':{const cx=e.x+30,cy=e.y,R=34*k,rr=R*ease(Math.min(1,u*1.6));
  field(cx,cy,R+6,.7,p,(d,a,dx,dy,x,y)=>{const n=hash(x>>1,y>>1,f>>2);const core=(1-d/(rr+1))*(1.35-u*1.3)+n*.12-.05;const ring=Math.exp(-Math.pow((d-rr)/(2.2+T*.4),2))*(1-u);return Math.max(core,ring)});
  if(e.t===4){hitArea(e.id,m=>Math.hypot(m.x-cx,(m.y-cy)/.7)<R,120*T,2.2+T*.5,cx,cy);shake=T>=3?6:3;for(let i=0;i<20+T*14;i++){const a=Math.random()*6.28,s=.6+Math.random()*2*k;spark(cx,cy,Math.cos(a)*s,Math.sin(a)*s*.7-.4,24+Math.random()*24,p,.03)}}
  if(e.t%3===0)spark(cx+(Math.random()-.5)*rr,cy+(Math.random()-.5)*rr*.5,(Math.random()-.5)*.3,-.5-Math.random()*.6,30,p);break}
 case'slash':case'spin':{const spin=e.kind==='spin',cx=e.x+(spin?-10:4),cy=e.y+2,R=(spin?34:40)*k,prog=Math.min(1,u*2.4),fade=Math.pow(1-u,.8);
  const a0=spin?-Math.PI:-1.3,span=spin?Math.PI*2:2.6,lead=a0+span*prog;
  field(cx,cy,R,.62,p,(d,a)=>{const rel=spin?((a-a0)%6.283+6.283)%6.283:a-a0;if(rel<0||rel>span*prog)return 0;const behind=(span*prog-rel)/span;const band=Math.exp(-Math.pow((d-R*.72)/(R*.13*(1-behind*.6)+1),2));return band*(1.25-behind*1.6)*fade});
  if(e.t===5)hitArea(e.id,m=>{const dx=m.x-cx,dy=(m.y-cy)/.62;return Math.hypot(dx,dy)<R+4&&(spin||dx>-4)},90*T,1.6+T*.5,cx,cy);
  if(prog<1)for(let i=0;i<2+T;i++)spark(cx+Math.cos(lead)*R*.72,cy+Math.sin(lead)*R*.72*.62,Math.cos(lead+1.6)*1.2,Math.sin(lead+1.6)*.8,14+Math.random()*10,p);break}
 case'wave':{const dist=150*ease(u),front=e.x+dist,len=26+T*6,half=16+T*5,fade=u>.75?(1-u)/.25:1;
  for(let y=e.y-half|0;y<=e.y+half;y++){const curl=Math.sin(y*.35+f*.25)*3+Math.sin(y*.9)*1.5;for(let x=front-len|0;x<=front+4;x++){const back=(front+curl-x)/len;if(back<0||back>1)continue;const edge=1-Math.abs(y-e.y)/half;let v=(back<.12?1.3:(1-back)*.9)*fade*Math.min(1,edge*2.2);if(back>.5&&hash(x,y,f>>1)<.15)v*=.4;shade(x,y,v,p)}}
  hitArea(e.id,m=>m.x<front+3&&m.x>front-len&&Math.abs(m.y-e.y)<half,70*T,.8+T*.3,front-40,e.y);for(const m of mobs)if(m.hitBy===e.id&&m.x<front+6)m.vx=Math.max(m.vx,1.6);
  if(e.t%2===0)spark(front,e.y+(Math.random()-.5)*half*2,1.2+Math.random(),-.4-Math.random()*.8,20,p,.05);break}
 case'field':{const cx=e.x+46,cy=e.y,R=30*k,app=ease(Math.min(1,u*5)),out=u>.85?(1-u)/.15:1,r=R*app;
  field(cx,cy,R+2,.58,p,(d,a)=>{const edge=Math.exp(-Math.pow((d-r)/1.6,2))*1.2;const inner=d<r?.22+.12*Math.sin(f*.2):0;const spoke=d>r*.45&&d<r*.85&&Math.cos(6*(a-f*.05))>.93?.95:0;const inner2=T>=3?Math.exp(-Math.pow((d-r*.55)/1.2,2))*.9:0;return Math.max(edge,inner,spoke,inner2)*out});
  if(e.t%22===8){e.id=idc++;hitArea(e.id,m=>Math.hypot(m.x-cx,(m.y-cy)/.58)<r,60*T,.5,cx,cy);for(let i=0;i<10+T*4;i++){const a=Math.random()*6.28;spark(cx+Math.cos(a)*r,cy+Math.sin(a)*r*.58,0,-.6-Math.random(),26,p)}}break}
 case'shot':{const n=2+T,fly=ease(Math.min(1,u*1.3));for(let j=0;j<n;j++){const ang=(j-(n-1)/2)*.32,dist=20+130*fly,lx=e.x+Math.cos(ang)*dist,ly=e.y+Math.sin(ang)*dist*.7,rot=f*.45+j;
   if(u<.8){field(lx,ly,7+T,1,p,(d,a)=>{const da=Math.cos(a-rot);return d>4&&d<7+T&&da>.1?(1.2-Math.abs(d-6)/4)*da:0});spark(lx,ly,-.6,(Math.random()-.5)*.4,12,p);
    hitArea(e.id*100+j,m=>Math.hypot(m.x-lx,m.y-ly)<8,55*T,1.4,lx-10,ly)}
   else if(!e['b'+j]){e['b'+j]=1;for(let i=0;i<8+T*3;i++){const a=Math.random()*6.28;spark(lx,ly,Math.cos(a)*1.5,Math.sin(a)*1.2,18,p)}}}break}
 case'taiji':{const cx=e.x+48,cy=e.y-2,R=(24+T*5),grow=u<.2?ease(u/.2):1,end=u>.78,r=R*grow,rot=f*.06,ic=P.ice;
  if(!end){field(cx,cy,r+3,1,p,(d,a,dx,dy)=>{if(d>r)return Math.exp(-Math.pow((d-r-1.5)/1.2,2))*1.1;const c=Math.cos(rot),s=Math.sin(rot),X=dx*c+dy*s,Y=-dx*s+dy*c,h=r/2;let white=X>0;const dT=Math.hypot(X,Y+h),dB=Math.hypot(X,Y-h);if(dT<h)white=true;if(dB<h)white=false;if(dT<r/7)white=false;if(dB<r/7)white=true;return white?1.1:.18});
   for(let i=0;i<12+T*3;i++){const a=i/(12+T*3)*6.28+f*.03,rr=r+5+Math.sin(f*.2+i)*2;const x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;put(x,y,ic[3],true);put(x+1,y,ic[2])}
   if(e.t===20){hitArea(e.id,m=>Math.hypot(m.x-cx,m.y-cy)<R+6,150*T,2.5,cx,cy);shake=T>=3?5:2}}
  else if(!e.boom){e.boom=1;hitArea(idc++,m=>Math.hypot(m.x-cx,m.y-cy)<R+14,90*T,3,cx,cy);shake=T>=3?8:4;for(let i=0;i<40+T*20;i++){const a=Math.random()*6.28,s=.5+Math.random()*2.6;spark(cx+Math.cos(a)*R*.5,cy+Math.sin(a)*R*.5,Math.cos(a)*s,Math.sin(a)*s,20+Math.random()*24,i%2?p:ic)}}break}
 case'ice':{const cx=e.x+26,cy=e.y+4,R=48*k,rr=R*ease(Math.min(1,u*1.5)),fade=u>.7?(1-u)/.3:1;
  field(cx,cy,R+4,.5,p,d=>(Math.exp(-Math.pow((d-rr)/(1.8+T*.3),2))*1.2+(d<rr?.16:0))*fade);
  const n=10+T*4;for(let i=0;i<n;i++){const a=i/n*6.28+.2,sr=rr*.85,sx=cx+Math.cos(a)*sr,sy=cy+Math.sin(a)*sr*.5,hgt=(5+T*2)*Math.min(1,Math.max(0,(u-.15)*4))*fade;for(let h=0;h<hgt;h++){const w=Math.max(0,(hgt-h)/hgt*2.4|0);for(let dx=-w;dx<=w;dx++)put(sx+dx,sy-h,p[dx===-w?1:h>hgt-3?4:dx<0?2:3],dx>=0)}}
  if(e.t===10){hitArea(e.id,m=>Math.hypot(m.x-cx,(m.y-cy)/.5)<R,100*T,1.2,cx,cy);shake=T>=3?4:1}
  if(e.t%4===0)spark(cx+(Math.random()-.5)*rr*2,cy+(Math.random()-.5)*rr,0,-.3,28,p);break}}
 e.t++;return e.t<e.dur}
// ── 한 장면 그리기 ──
let S=3;
function fit(){const st=document.getElementById('stage');const w=st.clientWidth;S=Math.max(1,Math.floor(Math.min(w/W,(innerHeight-230)/H)));if(S<2&&w>=W*2)S=2;cv.width=W*S;cv.height=H*S;cv.style.width=W*S+'px';cv.style.height=H*S+'px'}
addEventListener('resize',fit);
function tick(){frame++;B.set(ground);G.fill(0);
 for(const m of mobs){m.vx+=(m.hx-m.x)*.012;m.vy+=(m.hy-m.y)*.012;m.x+=m.vx;m.y+=m.vy;m.vx*=.86;m.vy*=.86;if(m.flash)m.flash--;m.y=clamp(m.y,26,172);if(m.x<hero.x+16){m.x=hero.x+16;m.vx=Math.abs(m.vx)}}
 const ents=[...mobs.map(m=>({y:m.y,m})),{y:hero.y,h:1}].sort((a,b)=>a.y-b.y);
 for(const o of ents){if(o.h){shadow(hero.x,hero.y);sprite(SK.hero,hero.x+(hero.lean>0?2:0),hero.y,0,false)}else{const m=o.m;shadow(m.x,m.y);sprite(SK.mob,m.x,m.y+(Math.sin(frame*.2+m.seed)>.6?-1:0),m.flash>0,true)}}
 if(hero.lean>0)hero.lean--;
 fx=fx.filter(runFx);
 for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.x+=q.vx;q.y+=q.vy;q.vy+=q.grav;q.vx*=.97;q.life--;const l=q.life/q.max;put(q.x,q.y,q.pal[clamp(l*5|0,1,4)],l>.35);if(q.life<=0)parts.splice(i,1)}
 for(let i=nums.length-1;i>=0;i--){const n=nums[i];n.y-=.35;n.life--;digits(n.v,n.x|0,n.y|0,n.crit?YEL:WHITE);if(n.life<=0)nums.splice(i,1)}
 if(auto&&--autoT<=0){cast((cur+1)%SKILLS.length);autoT=SKILLS[cur].dur+40}}
function render(){bc.putImageData(bImg,0,0);gc.putImageData(gImg,0,0);
 let ox=0,oy=0;if(shake>0){ox=Math.round((Math.random()-.5)*shake)*S;oy=Math.round((Math.random()-.5)*shake)*S;shake*=.85;if(shake<.3)shake=0}
 dc.imageSmoothingEnabled=false;dc.globalCompositeOperation='source-over';dc.filter='none';dc.fillStyle='#000';dc.fillRect(0,0,cv.width,cv.height);dc.drawImage(base,ox,oy,W*S,H*S);
 if(glowOn){dc.imageSmoothingEnabled=true;dc.globalCompositeOperation='lighter';dc.filter='blur('+(S*4)+'px)';dc.globalAlpha=1;dc.drawImage(glowC,ox,oy,W*S,H*S);dc.drawImage(glowC,ox,oy,W*S,H*S);dc.filter='blur('+(S*1.5)+'px)';dc.globalAlpha=.85;dc.drawImage(glowC,ox,oy,W*S,H*S);dc.globalAlpha=1;dc.filter='none';dc.globalCompositeOperation='source-over'}
}
let acc=0,last=0;function step(now){if(!last)last=now;acc+=Math.min(100,now-last);last=now;let ran=false;while(acc>=1000/60){tick();acc-=1000/60;ran=true}if(ran)render();requestAnimationFrame(step)}

const ab=document.getElementById('autoBtn');function syncAuto(){ab.setAttribute('aria-pressed',auto);ab.textContent=auto?'자동 재생 켜짐':'자동 재생 꺼짐'}ab.onclick=()=>{auto=!auto;syncAuto();autoT=0};

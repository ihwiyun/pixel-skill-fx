<style>

<header><h1>도트 스킬 이펙트 연습장</h1><p>스킬을 누르면 바로 씁니다. 단계가 오를수록 이펙트가 커지고 세집니다.</p></header>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="vfxkit.js"></script><script src="chars.js"></script><script>
'use strict';
const W=480,H=270,N=W*H;
const cv=document.getElementById('cv'),dc=cv.getContext('2d');
const base=document.createElement('canvas');base.width=W;base.height=H;const bc=base.getContext('2d');
const glowC=document.createElement('canvas');glowC.width=W;glowC.height=H;const gc=glowC.getContext('2d');
const bImg=bc.createImageData(W,H),gImg=gc.createImageData(W,H);
const B=new Uint32Array(bImg.data.buffer),G=new Uint32Array(gImg.data.buffer);
const hex=h=>{const n=parseInt(h.slice(1),16);return ((255<<24)|((n&255)<<16)|(n&0xff00)|(n>>16))>>>0};
// 문파(색 묶음): 어두움 → 밝음 5단. smoke는 빛이 번지지 않는 연기
const PN=['fire','crimson','ocean','gold','void','jade','yin','ice','smoke'];
const PAL={fire:['#4a0d02','#a32306','#ec5a0e','#ffb03c','#fff4c4'],crimson:['#33051a','#8e0f36','#e2285a','#ff86ab','#ffe6ee'],ocean:['#061c4a','#0d4fa0','#1f8fe0','#86dcff','#f4ffff'],gold:['#3a2402','#8a5d08','#e0a81e','#ffe684','#fffbe6'],void:['#1a0838','#4b1b9a','#9254f2','#d0b2ff','#f8f2ff'],jade:['#06301a','#147a32','#41d659','#bcff84','#f6ffe6'],yin:['#050507','#2a2a31','#8f8f99','#e0e0e8','#ffffff'],ice:['#08223a','#185a8a','#3aa8e0','#a8ecff','#ffffff'],smoke:['#121216','#1d1d23','#2a2a31','#393942','#4a4a54']};
const P=PN.map(k=>PAL[k].map(hex));const PI={};PN.forEach((k,i)=>PI[k]=i);
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const clamp=(v,a,b)=>v<a?a:v>b?b:v,ease=t=>1-Math.pow(1-t,3),TAU=Math.PI*2;
const hash=(x,y,s)=>{let h=(x*374761393+y*668265263+s*1442695041)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296};
// 값 잡음(불꽃 혀·물결 결을 만드는 매끈한 무작위)
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=hash(xi,yi,1),b=hash(xi+1,yi,1),c=hash(xi,yi+1,1),d=hash(xi+1,yi+1,1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
const fbm=(x,y)=>vn(x,y)*.55+vn(x*2.1,y*2.1)*.3+vn(x*4.3,y*4.3)*.15;
let frame=0;
// ── 층: 바닥 이펙트(사람 아래) / 공중 이펙트(사람 위). 잔상은 세기가 조금씩 줄면서 남는다 ──
const FI=[new Float32Array(N),new Float32Array(N)],FP=[new Uint8Array(N),new Uint8Array(N)];
const OF=new Uint32Array(N),OV=new Uint32Array(N),OG=new Uint32Array(N),CUSTOM={};
const HS=new Float32Array(N);
function add(x,y,v,pi,L){x|=0;y|=0;if(x<0||y<0||x>=W||y>=H||v<=0)return;const i=y*W+x,f=FI[L||0];if(v>f[i]){f[i]=v;FP[L||0][i]=pi}}
function heat(x,y,v){x|=0;y|=0;if(x<0||y<0||x>=W||y>=H)return;const i=y*W+x;if(v>HS[i])HS[i]=v}
// 손으로 그리는 이펙트용: pb=캐릭터 뒤(바닥), pv=캐릭터 앞, pa=뒤에 반투명으로 섞기
function pb(x,y,col,g){x|=0;y|=0;if(x<0||y<0||x>=W||y>=H)return;const i=y*W+x;OF[i]=col;if(g)OG[i]=col}
function pv(x,y,col,g){x|=0;y|=0;if(x<0||y<0||x>=W||y>=H)return;const i=y*W+x;OV[i]=col;if(g)OG[i]=col}
function pa(x,y,col,a){x|=0;y|=0;if(x<0||y<0||x>=W||y>=H)return;const i=y*W+x,b=OF[i]||ground[i],k=a*256|0,m=256-k;OF[i]=(255<<24|((((b>>16&255)*m+(col>>16&255)*k)>>8)<<16)|((((b>>8&255)*m+(col>>8&255)*k)>>8)<<8)|(((b&255)*m+(col&255)*k)>>8))>>>0}
const frac=v=>v-Math.floor(v);
function put(x,y,c,glow){x|=0;y|=0;if(x<0||y<0||x>=W||y>=H)return;const i=y*W+x;B[i]=c;if(glow)G[i]=c}
// 원·타원 범위를 돌며 세기를 매긴다(sy: 위에서 비스듬히 본 납작함)
// 뻗치는 가시·빛줄기: 뿌리는 굵고 끝은 뾰족
// 타원 고리(위에서 본 원)
// 불꽃 혀 한 줄기(아래에서 위로 흔들리며 솟음)
function flame(x,y,h,w,v,L){const pi=0;for(let k=0;k<h;k++){const r=k/h,sway=(fbm(x*.15,(frame-k)*.12)-.5)*4*r,ww=w*(1-r*.85);for(let o=-ww;o<=ww;o+=.5)add(x+sway+o,y-k,v*(1.15-r*.75)*(1-Math.abs(o)/(ww+.5)*.5),pi,L)}}
// ── 바닥 ──
const ground=new Uint32Array(N);
(function(){for(let y=0;y<H;y++)for(let x=0;x<W;x++){const n=fbm(x*.03,y*.05),m=hash(x,y,3);let c=n<.45?'#1f2128':n<.6?'#22252c':'#25282f';if(m>.992)c='#2c3038';ground[y*W+x]=hex(c)}})();
// ── 숫자 도트 글꼴(3x5) ──
const DG=['111101101101111','010110010010111','111001111100111','111001111001111','101101111001001','111100111001111','111100111101111','111001010010010','111101111101111','111101111001111'];
const FLO=hex('#9fc8f0'),BLACK=hex('#000000'),WHITE=hex('#ffffff'),YEL=hex('#ffd34d'),SHD=hex('#121318');
function digits(n,x,y,c){const s=String(n);for(let k=0;k<s.length;k++){const g=DG[+s[k]];for(let i=0;i<15;i++)if(g[i]==='1'){const px=x+k*4+i%3,py=y+(i/3|0);put(px+1,py+1,BLACK);put(px,py,c,true)}}}
// ── 사람(주인공·산적) ──
const SPR={hero:CH.hero};
const SC0=CH.heroPal;
const MOBC=CH.mobPal;
const SC=Object.assign({},SC0);
for(const k in SC)SC[k]=hex(SC[k]);const tint=(h,k)=>{const n=parseInt(h.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return hex('#'+[r+(255-r)*k*.9|0,g+(150-g)*k|0,b*(1-k)|0].map(q=>q.toString(16).padStart(2,'0')).join(''))};
const MOBB=MOBC.map(m=>{const o={};for(const k in SC0)o[k]=tint(m[k]||SC0[k],.45);return o});
const MOBP=MOBC.map(m=>{const o={};for(const k in SC0)o[k]=hex(m[k]||SC0[k]);return o});
// 하얗게 번쩍인 뒤 잠깐 비치는 반투명 모습(레퍼런스 금륜진): 원래 색을 흰색 쪽으로 60% 섞음
const GHOST=MOBP.map(o=>{const g={};for(const k in o){const c=o[k],f=v=>v+((255-v)*.6|0);g[k]=(255<<24|f(c>>16&255)<<16|f(c>>8&255)<<8|f(c&255))>>>0}return g});
function sprite(s,x,y,flash,flip,pal){const w=s[0].length,hh=s.length;pal=pal||SC;for(let r=0;r<hh;r++)for(let c=0;c<w;c++){const ch=s[r][flip?w-1-c:c];if(ch!=='.')put(x-(w>>1)+c,y-hh+1+r,flash?(ch==='o'?FLO:WHITE):pal[ch],false)}}
function sword(x,y,flip,a){const d=flip?-1:1;a=a===undefined?-.35:a;const c=Math.cos(a)*d,sn=Math.sin(a),hx=x+d*9,hy=y-24;
 // a: 칼 각도(0 = 앞으로 찌르기, 음수 = 치켜듦). 손잡이 4칸(금), 날 22칸(가운데 밝은 줄 + 아래 어두운 줄)
 for(let i=-3;i<23;i++){const px=hx+c*i,py=hy+sn*i;if(i<1){put(px,py,hex('#d8b04a'));put(px-sn*d,py+Math.abs(c),hex('#6a4a18'));continue}put(px,py,hex('#eef2f8'));put(px-sn*d,py+Math.abs(c),hex('#8a96aa'));if(i<20)put(px+sn*d,py-Math.abs(c),hex('#c8d0dc'))}}
function shadow(x,y){for(let dx=-13;dx<=13;dx++)for(let dy=-3;dy<=3;dy++)if(dx*dx/169+dy*dy/10<1)put(x+dx,y+dy,SHD)}
const hero={x:168,y:176,lean:0,jy:0,sa:undefined};
const mobs=[];for(let i=0;i<14;i++){const x=i<12?222+(i%4)*56+(i>>2&1)*24+Math.random()*10:446,y=i<12?112+(i>>2)*58+Math.random()*10:i===12?140:226;mobs.push({x,y,hx:x,hy:y,dx:x,dy:y,vx:0,vy:0,flash:0,burn:0,stun:0,splash:0,pal:i%4,seed:Math.random()*99,hit:{}})}
const nums=[],parts=[],marks=[];let fx=[],shake=0,ringLay=false;
// 배치: 기본은 주인공 왼쪽·적 오른쪽, 'ring'이면 주인공을 가운데 두고 적이 둘레를 둘러싼다(금륜진 레퍼런스 배치)
// 레퍼런스 금륜진 첫 장(#11)에서 잰 적 발 위치(주인공 기준, 진짜 픽셀)
const RINGPOS=[[-36,-79],[32,-81],[-72,-36],[86,-34],[-61,-13],[61,-13],[-79,31],[76,27],[-29,38],[29,38],[-40,77],[36,70],[-29,-50],[22,-49]];
function layout(ring){ringLay=ring;hero.x=ring?240:168;hero.y=ring?158:176;mobs.forEach((m,i)=>{if(ring){const p=RINGPOS[i];m.hx=hero.x+p[0];m.hy=hero.y+p[1]}else{m.hx=m.dx;m.hy=m.dy}m.x=m.hx;m.y=m.hy;m.vx=m.vy=0})}
function hitArea(id,test,dmg,push,cx,cy,opt){for(const m of mobs){if(m.hit[id])continue;if(test(m)){m.hit[id]=1;m.flash=6;const a=Math.atan2(m.y-cy,m.x-cx);m.vx+=Math.cos(a)*push;m.vy+=Math.sin(a)*push*.6;{const crit=Math.random()<.22;if(crit||Math.random()<.35)nums.push({x:m.x-5,y:m.y-56,v:Math.round(dmg*(crit?1.8:1)*(.85+Math.random()*.3)),life:36,crit})}marks.push({x:m.x,y:m.y-24,life:10,pi:opt&&opt.pi!==undefined?opt.pi:3});if(opt&&opt.burn)m.burn=90}}}
function stars(x,y){for(let k=0;k<3;k++){const a=frame*.12+k*TAU/3,sx=x+Math.cos(a)*9|0,sy=y+Math.sin(a)*3|0,c=hex('#ffe27a');put(sx,sy,c,true);put(sx+1,sy,c,true);put(sx-1,sy,c,true);put(sx,sy+1,c,true);put(sx,sy-1,c,true)}}
function splash(x,y,n){const u=n/20,c1=hex('#f2fbff'),c2=hex('#69b8f4'),c3=hex('#1650b4');for(let k=0;k<20;k++){const a=k/20*Math.PI*1.4-.7+(1-u)*2,r=6+k*.25,px=x+Math.cos(a)*r*.55|0,py=y-14-k*.9+Math.sin(a)*2|0;if(hash(k,n,3)<u*1.2){put(px,py,k%3?c1:c2,true);put(px+1,py,c3)}}}
// 방어 깨짐 표시: 맞은 적 머리 위 방패가 지그재그로 갈라져 벌어진다
const SHC={o:hex('#4a0a08'),a:hex('#ff8a6a'),b:hex('#d8392c')};
const SH=['..oooooooo..','.oaaaaaaaao.','oaabbbbbbaao','oabbbbbbbbao','oabbbbbbbbao','oabbbbbbbbao','.oabbbbbbao.','.oabbbbbbao.','..oabbbbao..','...oabbao...','....oaao....','.....oo.....'];
const ZZ=[6,5,7,5,6,4,6,5,6,5,6,6];
function shields(){for(const m of mobs){if(!m.shield)continue;m.shield--;const sp=Math.min(5,(40-m.shield)*.4),x=m.x-6,y=m.y-64;
 for(let r=0;r<12;r++)for(let k=0;k<12;k++){const ch=SH[r][k];if(ch==='.')continue;const left=k<ZZ[r];if(k===ZZ[r]||k===ZZ[r]-1&&ch!=='o'){pv(x+k+(left?-sp:sp),y+r,SHC.o);continue}pv(x+k+(left?-sp:sp),y+r+(left?0:1),SHC[ch])}}}

function spark(x,y,vx,vy,life,pi,o){parts.push(Object.assign({x,y,vx,vy,life,max:life,pi,grav:0,drag:.97,size:1,L:1},o||{}))}
// ── 스킬 8개 ──
const SKILLS=[
{name:'화룡장',desc:'불꽃 용이 몸을 감고 돌다가, 땅을 따라 불길이 휩쓸고 나간다',pal:'fire',kind:'dragon',dur:150},
{name:'홍련검',desc:'그림자 모습으로 분홍 초승달 베기, 긴 찌르기, 분홍 소용돌이 폭발. 맞은 적은 방패가 깨진다',pal:'crimson',kind:'lotus',dur:100},
{name:'단해',desc:'큰 파도가 말려 올라 앞을 덮치고, 땅에 물웅덩이가 남는다',pal:'ocean',kind:'wave',dur:170},
{name:'금륜진',desc:'금빛 마법진 위에서 두 번 베어 금 고리를 퍼뜨리고, 보라 빛을 모아 길게 찌른 뒤 큰 금 고리로 터뜨린다',pal:'gold',kind:'sphere',dur:150,lay:'ring'},
{name:'취엽비',desc:'연두빛 회오리 고리 원반이 날아가고, 초록 가루를 끌며 돌진해 큰 초승달로 벤다',pal:'jade',kind:'hoops',dur:100},
{name:'태극인',desc:'푸른 불꽃 기운 속에서 태극이 커지며 날아가고, 발밑의 누운 태극 둘레로 푸른 소용돌이가 돈다',pal:'yin',kind:'taiji',dur:140}];
let cur=0,tier=2,glowOn=true,auto=true,autoT=0,idc=1;
function cast(i){cur=i;const s=SKILLS[i];if((s.lay==='ring')!==ringLay)layout(s.lay==='ring');hero.sa=undefined;hero.jy=0;hero.ox=0;hero.pal=null;fx=[];VFX.clear();for(const m of mobs){m.stun=m.splash=m.burn=m.shield=m.ghost=0;m.glyph=m.sig=0}fx.push({...s,t:0,tier,id:idc++,pi:PI[s.pal],seed:Math.random()*99});hero.lean=8;
 document.getElementById('capName').textContent=s.name+' · '+tier+'단계';document.getElementById('capDesc').textContent=s.desc;
 document.querySelectorAll('#skills button').forEach((b,k)=>b.setAttribute('aria-pressed',k===i));}
function runFx(e){const r=CUSTOM[e.kind](e);e.t++;return r!==false&&e.t<e.dur}
// ── 한 번 움직이기(1초에 60번) ──
function tick(){frame++;VFX.tick();OF.fill(0);OV.fill(0);OG.fill(0);
 for(let L=0;L<2;L++){const f=FI[L];for(let i=0;i<N;i++)if(f[i]>0){f[i]*=L?.72:.8;if(f[i]<.05)f[i]=0}}
 for(let i=0;i<N;i++){if(HS[i]>0){HS[i]*=.9;if(HS[i]<.05)HS[i]=0}}
 for(const m of mobs){m.vx+=(m.hx-m.x)*.01;m.vy+=(m.hy-m.y)*.01;m.x+=m.vx;m.y+=m.vy;m.vx*=.86;m.vy*=.86;if(m.flash)m.flash--;else if(m.ghost)m.ghost--;m.y=clamp(m.y,ringLay?40:60,262);if(m.stun)m.stun--;if(m.splash)m.splash--;if(!ringLay&&m.x<hero.x+18){m.x=hero.x+18;m.vx=Math.abs(m.vx)}
  if(m.burn>0){m.burn--;if(m.burn%2===0)for(let c=0;c<3;c++)flame(m.x-6+c*6,m.y-4-(c&1)*6,12,2,.62,1);if(m.burn%30===0)nums.push({x:m.x-4,y:m.y-56,v:12+(Math.random()*8|0),life:30,crit:false})}}
 if(hero.lean>0)hero.lean--;
 fx=fx.filter(runFx);shields();
 for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.x+=q.vx;q.y+=q.vy;q.vy+=q.grav;q.vx*=q.drag;q.vy*=q.drag;q.life--;const l=q.life/q.max;
  const v=q.pi===8?.9*l+.3:.35+1.1*l;if(q.star){add(q.x,q.y,v+.3,q.pi,1);if(l>.4){add(q.x+1,q.y,v,q.pi,1);add(q.x-1,q.y,v,q.pi,1);add(q.x,q.y+1,v,q.pi,1);add(q.x,q.y-1,v,q.pi,1)}}

 for(let i=marks.length-1;i>=0;i--){const mk=marks[i];mk.life--;const r=mk.life>5?3:2;for(let o=-r;o<=r;o++){add(mk.x+o,mk.y,1.4,mk.pi,1);add(mk.x,mk.y+o,1.4,mk.pi,1)}if(mk.life<=0)marks.splice(i,1)}

 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x;let sx=x;if(HS[i]>0)sx=clamp(x+Math.round(Math.sin(y*.7+frame*.45)*HS[i]*1.6),0,W-1);let c=ground[y*W+sx];B[i]=c}
 G.fill(0);shadeLayer(0);for(let i=0;i<N;i++){if(OF[i])B[i]=OF[i];if(OG[i])G[i]=OG[i]}

 for(let i=0;i<N;i++)if(OV[i])B[i]=OV[i];
 shadeLayer(1);
 for(let i=nums.length-1;i>=0;i--){const n=nums[i];n.y-=.3;n.life--;digits(n.v,n.x|0,n.y|0,n.crit?YEL:WHITE);if(n.life<=0)nums.splice(i,1)}
 bc.putImageData(bImg,0,0);gc.putImageData(gImg,0,0);
 let ox=0,oy=0;if(shake>0){ox=Math.round((Math.random()-.5)*shake)*S;oy=Math.round((Math.random()-.5)*shake)*S;shake*=.86;if(shake<.3)shake=0}
 dc.globalCompositeOperation='source-over';dc.filter='none';dc.globalAlpha=1;dc.imageSmoothingEnabled=false;dc.drawImage(base,ox,oy,W*S,H*S);
 if(glowOn){dc.globalCompositeOperation='lighter';
  dc.imageSmoothingEnabled=true;dc.filter='blur('+(S*5)+'px)';dc.drawImage(glowC,ox,oy,W*S,H*S);dc.filter='blur('+(S*2)+'px)';dc.globalAlpha=.9;dc.drawImage(glowC,ox,oy,W*S,H*S);dc.globalAlpha=1;dc.filter='none';dc.globalCompositeOperation='source-over'}
 VFX.render(glowOn,ox,oy)}

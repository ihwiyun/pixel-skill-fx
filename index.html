<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>도트 스킬 이펙트</title>
<style>
:root{--bg:#0d0f14;--panel:#171a22;--line:#2a2f3c;--ink:#e8e6df;--sub:#9aa0ad}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif}
.wrap{max-width:1480px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-left,0px)) 20px max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:10px}
h1{font-size:1.15rem;margin:0}
header p{margin:0;color:var(--sub);font-size:.85rem}
.stage{position:relative;display:flex;justify-content:center;background:#16181d;border:1px solid var(--line);border-radius:8px;overflow:hidden}
canvas{display:block;image-rendering:pixelated;max-width:100%}
.cap{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(10,12,18,.82);border:1px solid var(--line);border-radius:6px;padding:6px 14px;text-align:center;pointer-events:none;white-space:nowrap}
.cap b{display:block;font-size:1rem}
.cap span{font-size:.78rem;color:var(--sub)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.bar .grp{display:flex;flex-wrap:wrap;gap:6px}
button{min-height:40px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:.88rem;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
button[aria-pressed="true"]{border-color:#e8e6df;background:#2a2f3c}
button:focus-visible{outline:2px solid #ffe27a;outline-offset:2px}
.chip{width:12px;height:12px;border-radius:3px;display:inline-block}
.sep{width:1px;height:28px;background:var(--line);margin:0 4px}
</style></head><body><div class="wrap">
<header><h1>도트 스킬 이펙트 연습장</h1><p>스킬을 누르면 바로 씁니다. 단계가 오를수록 이펙트가 커지고 세집니다.</p></header>
<div class="stage" id="stage"><canvas id="cv"></canvas><div class="cap"><b id="capName"></b><span id="capDesc"></span></div></div>
<div class="bar"><div class="grp" id="skills"></div></div>
<div class="bar">
 <div class="grp" id="tiers"></div><span class="sep"></span>
 <div class="grp"><button id="glowBtn" aria-pressed="true">빛 번짐 켜짐</button><button id="autoBtn" aria-pressed="true">자동 재생 켜짐</button></div>
</div></div>
<script>
'use strict';
const W=480,H=270,N=W*H;
const cv=document.getElementById('cv'),dc=cv.getContext('2d');
const base=document.createElement('canvas');base.width=W;base.height=H;const bc=base.getContext('2d');
const glowC=document.createElement('canvas');glowC.width=W;glowC.height=H;const gc=glowC.getContext('2d');
const bImg=bc.createImageData(W,H),gImg=gc.createImageData(W,H);
const B=new Uint32Array(bImg.data.buffer),G=new Uint32Array(gImg.data.buffer);
const hex=h=>{const n=parseInt(h.slice(1),16);return ((255<<24)|((n&255)<<16)|(n&0xff00)|(n>>16))>>>0};
// 문파(색 묶음): 어두움 → 밝음 5단. smoke는 빛이 번지지 않는 연기
const PN=['fire','crimson','ocean','gold','void','jade','yin','ice','smoke'];
const PAL={fire:['#4a0d02','#a32306','#ec5a0e','#ffb03c','#fff4c4'],crimson:['#33051a','#8e0f36','#e2285a','#ff86ab','#ffe6ee'],ocean:['#061c4a','#0d4fa0','#1f8fe0','#86dcff','#f4ffff'],gold:['#3a2402','#8a5d08','#e0a81e','#ffe684','#fffbe6'],void:['#1a0838','#4b1b9a','#9254f2','#d0b2ff','#f8f2ff'],jade:['#06301a','#147a32','#41d659','#bcff84','#f6ffe6'],yin:['#050507','#2a2a31','#8f8f99','#e0e0e8','#ffffff'],ice:['#08223a','#185a8a','#3aa8e0','#a8ecff','#ffffff'],smoke:['#121216','#1d1d23','#2a2a31','#393942','#4a4a54']};
const P=PN.map(k=>PAL[k].map(hex));const PI={};PN.forEach((k,i)=>PI[k]=i);
const DECAL=[hex('#2a1208'),hex('#2c0a16'),hex('#0f2a4c'),hex('#2e2208'),hex('#1e1036'),hex('#0e2a16'),hex('#18181c'),hex('#1a3a52'),hex('#1a1a1e')];
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const clamp=(v,a,b)=>v<a?a:v>b?b:v,ease=t=>1-Math.pow(1-t,3),TAU=Math.PI*2;
const hash=(x,y,s)=>{let h=(x*374761393+y*668265263+s*1442695041)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296};
// 값 잡음(불꽃 혀·물결 결을 만드는 매끈한 무작위)
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=hash(xi,yi,1),b=hash(xi+1,yi,1),c=hash(xi,yi+1,1),d=hash(xi+1,yi+1,1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
const fbm=(x,y)=>vn(x,y)*.55+vn(x*2.1,y*2.1)*.3+vn(x*4.3,y*4.3)*.15;
let frame=0;
// ── 층: 바닥 이펙트(사람 아래) / 공중 이펙트(사람 위). 잔상은 세기가 조금씩 줄면서 남는다 ──
const FI=[new Float32Array(N),new Float32Array(N)],FP=[new Uint8Array(N),new Uint8Array(N)];
const DI=new Float32Array(N),DP=new Uint8Array(N),HS=new Float32Array(N);
function add(x,y,v,pi,L){x|=0;y|=0;if(x<0||y<0||x>=W||y>=H||v<=0)return;const i=y*W+x,f=FI[L||0];if(v>f[i]){f[i]=v;FP[L||0][i]=pi}}
function setp(x,y,v,pi,L){x|=0;y|=0;if(x<0||y<0||x>=W||y>=H)return;const i=y*W+x;FI[L||0][i]=v;FP[L||0][i]=pi}
function decal(x,y,v,pi){x|=0;y|=0;if(x<0||y<0||x>=W||y>=H)return;const i=y*W+x;if(v>DI[i]){DI[i]=v;DP[i]=pi}}
function heat(x,y,v){x|=0;y|=0;if(x<0||y<0||x>=W||y>=H)return;const i=y*W+x;if(v>HS[i])HS[i]=v}
function put(x,y,c,glow){x|=0;y|=0;if(x<0||y<0||x>=W||y>=H)return;const i=y*W+x;B[i]=c;if(glow)G[i]=c}
// 원·타원 범위를 돌며 세기를 매긴다(sy: 위에서 비스듬히 본 납작함)
function field(cx,cy,R,sy,pi,L,fn){const x0=Math.max(0,cx-R|0),x1=Math.min(W-1,cx+R|0),y0=Math.max(0,cy-R*sy|0),y1=Math.min(H-1,cy+R*sy|0);
 for(let y=y0;y<=y1;y++){const dy=(y-cy)/sy;for(let x=x0;x<=x1;x++){const dx=x-cx,d=Math.hypot(dx,dy);if(d>R)continue;const v=fn(d,Math.atan2(dy,dx),dx,dy,x,y);if(v>0)add(x,y,v,pi,L)}}}
// 뻗치는 가시·빛줄기: 뿌리는 굵고 끝은 뾰족
function ray(x0,y0,a,len,w,v,pi,L,sy){const c=Math.cos(a),s=Math.sin(a)*(sy||1);for(let t=0;t<len;t+=.5){const k=1-t/len,ww=w*k;for(let o=-ww;o<=ww;o+=.5){add(x0+c*t-s*o*.9,y0+s*t+c*o*.5,v*(.5+.7*k)*(1-Math.abs(o)/(ww+.6)*.6),pi,L)}}}
// 타원 고리(위에서 본 원)
function ring(cx,cy,r,sy,th,v,pi,L,a0,a1){a0=a0||0;a1=a1===undefined?TAU:a1;const st=.6/Math.max(r,4);for(let a=a0;a<a1;a+=st){const c=Math.cos(a),s=Math.sin(a);for(let o=-th;o<=th;o+=.5)add(cx+c*(r+o),cy+s*(r+o)*sy,v*(1-Math.abs(o)/(th+1)*.7),pi,L)}}
// 불꽃 혀 한 줄기(아래에서 위로 흔들리며 솟음)
function flame(x,y,h,w,v,L){const pi=0;for(let k=0;k<h;k++){const r=k/h,sway=(fbm(x*.15,(frame-k)*.12)-.5)*4*r,ww=w*(1-r*.85);for(let o=-ww;o<=ww;o+=.5)add(x+sway+o,y-k,v*(1.15-r*.75)*(1-Math.abs(o)/(ww+.5)*.5),pi,L)}}
// ── 바닥 ──
const ground=new Uint32Array(N);
(function(){for(let y=0;y<H;y++)for(let x=0;x<W;x++){const n=fbm(x*.03,y*.05),m=hash(x,y,3);let c=n<.45?'#1f2128':n<.6?'#22252c':'#25282f';if(m>.992)c='#2c3038';ground[y*W+x]=hex(c)}})();
// ── 숫자 도트 글꼴(3x5) ──
const DG=['111101101101111','010110010010111','111001111100111','111001111001111','101101111001001','111100111001111','111100111101111','111001010010010','111101111101111','111101111001111'];
const BLACK=hex('#000000'),WHITE=hex('#ffffff'),YEL=hex('#ffd34d'),SHD=hex('#121318');
function digits(n,x,y,c){const s=String(n);for(let k=0;k<s.length;k++){const g=DG[+s[k]];for(let i=0;i<15;i++)if(g[i]==='1'){const px=x+k*4+i%3,py=y+(i/3|0);put(px+1,py+1,BLACK);put(px,py,c,true)}}}
// ── 사람(주인공·산적) ──
const SPR={hero:['....aaaa....','...aaaaaa...','...abbbba...','...bcbbcb...','....bbbb....','...dddddd...','..ddeddedd..','..ddddddddk.','..bdddddd.k.','...dddddd.k.','...ddeedd...','...dd..dd...','...ff..ff...','...ff..ff...','..gff..ffg..'],
mob:['....hhhh....','...iiiiii...','...jbbbbj...','...bcbbcb..l','....bbbb..l.','...mmmmmml..','..mmmmmmlm..','..bmmmmlmb..','...mmmlmm...','...nnlnnn...','...mlm.mm...','...ol..oo...','..lo...oo...','..oo...ooo..','............']};
const SC={a:'#18181e',b:'#e9b98d',c:'#1a1a22',d:'#e8e4d8',e:'#2f6fb8',f:'#3a3a46',g:'#26262e',k:'#cfd6e0',h:'#2a1c14',i:'#b8322a',j:'#2a1c14',l:'#8a5a2a',m:'#7a4a2a',n:'#3a2416',o:'#3a3028'};
for(const k in SC)SC[k]=hex(SC[k]);
function sprite(s,x,y,flash,flip){for(let r=0;r<s.length;r++)for(let c=0;c<12;c++){const ch=s[r][flip?11-c:c];if(ch!=='.')put(x-6+c,y-15+r,flash?WHITE:SC[ch],flash)}}
function shadow(x,y){for(let dx=-5;dx<=5;dx++)for(let dy=-1;dy<=1;dy++)if(dx*dx/30+dy*dy/1.6<1)put(x+dx,y+dy,SHD)}
const hero={x:120,y:150,lean:0,aura:0,auraPal:7};
const mobs=[];for(let i=0;i<40;i++){const x=200+Math.random()*270,y=60+Math.random()*190;mobs.push({x,y,hx:x,hy:y,vx:0,vy:0,flash:0,burn:0,seed:Math.random()*99,hit:{}})}
const nums=[],parts=[],marks=[];let fx=[],lights=[],shake=0;
function hitArea(id,test,dmg,push,cx,cy,opt){for(const m of mobs){if(m.hit[id])continue;if(test(m)){m.hit[id]=1;m.flash=6;const a=Math.atan2(m.y-cy,m.x-cx);m.vx+=Math.cos(a)*push;m.vy+=Math.sin(a)*push*.6;{const crit=Math.random()<.22;if(crit||Math.random()<.35)nums.push({x:m.x-5,y:m.y-22,v:Math.round(dmg*(crit?1.8:1)*(.85+Math.random()*.3)),life:36,crit})}marks.push({x:m.x,y:m.y-8,life:10,pi:opt&&opt.pi!==undefined?opt.pi:3});if(opt&&opt.burn)m.burn=90}}}
function spark(x,y,vx,vy,life,pi,o){parts.push(Object.assign({x,y,vx,vy,life,max:life,pi,grav:0,drag:.97,size:1,L:1},o||{}))}
function light(x,y,r,pi,a){lights.push({x,y,r,pi,a})}
// ── 스킬 8개 ──
const SKILLS=[
{name:'화룡장',desc:'불꽃 용이 몸을 감고 돌다가, 땅을 따라 불길이 휩쓸고 나간다',pal:'fire',kind:'dragon',dur:130},
{name:'홍련검',desc:'붉은 창끝 찌르기가 뻗고, 맞은 자리에 붉은 연꽃 소용돌이가 터진다',pal:'crimson',kind:'lotus',dur:84},
{name:'단해',desc:'큰 파도가 말려 올라 앞을 덮치고, 땅에 물웅덩이가 남는다',pal:'ocean',kind:'wave',dur:118},
{name:'금륜진',desc:'금빛 고리 여러 개가 공처럼 몸을 감싸고 돌며 여러 번 때린다',pal:'gold',kind:'sphere',dur:150},
{name:'자월참',desc:'보랏빛 회전 베기 뒤에 보랏빛 소용돌이가 날아간다',pal:'void',kind:'vortex',dur:90},
{name:'취엽비',desc:'초록 고리가 겹겹이 굴러가며 잎 칼날을 흩뿌린다',pal:'jade',kind:'hoops',dur:88},
{name:'태극인',desc:'푸른 기운 속에 태극이 날아가고, 발밑에 태극 진이 펼쳐진다',pal:'yin',kind:'taiji',dur:130},
{name:'빙륜',desc:'얼음 고리가 퍼지며 땅에서 얼음 가시가 뻗어 나와 부서진다',pal:'ice',kind:'ice',dur:96}];
let cur=0,tier=2,glowOn=true,auto=true,autoT=0,idc=1;
function cast(i){cur=i;const s=SKILLS[i];fx.push({...s,t:0,tier,id:idc++,pi:PI[s.pal],seed:Math.random()*99});hero.lean=8;
 document.getElementById('capName').textContent=s.name+' · '+tier+'단계';document.getElementById('capDesc').textContent=s.desc;
 document.querySelectorAll('#skills button').forEach((b,k)=>b.setAttribute('aria-pressed',k===i));}
function runFx(e){const T=e.tier,t=e.t,u=t/e.dur,k=1+(T-1)*.2,f=frame,pi=e.pi,hx=hero.x,hy=hero.y;
 switch(e.kind){
 case'dragon':{ // 1) 불꽃 용이 몸을 감아 돈다 2) 땅을 휩쓰는 불길
  if(t<56){const segs=14+T*2,grow=Math.min(1,t/14);for(let j=0;j<segs;j++){const a=t*.2-j*.3,rr=(22+j*.9)*k*grow,x=hx+Math.cos(a)*rr,y=hy-8+Math.sin(a)*rr*.5,sz=(j===0?8:6.5-j*.25)*k;
    if(sz<1.5)continue;field(x,y,sz+2,1,pi,1,(d,an,dx,dy,X,Y)=>{const e2=sz*(.65+.6*fbm(X*.25+f*.1,Y*.25-f*.15));return d<e2?(1.3-d/e2*.8)*(j===0?1.25:1-j/segs*.4):0});
    if(j%3===0&&Math.random()<.5)spark(x,y,(Math.random()-.5)*.6,-.4-Math.random()*.6,18+Math.random()*12,pi,{size:Math.random()<.4?2:1});}
   for(let c=0;c<4+T;c++)flame(hx+(c-(3+T)/2)*3,hy+1,(16+T*4)*grow*(.6+.5*hash(c,f>>2,5)),2.4,.78,1);
   light(hx,hy-10,60*k,pi,.55*grow);heat(hx,hy,1)}
  if(t===50){shake=T>=3?6:3;for(let r=0;r<10+T*4;r++)e['r'+r]=Math.random()*TAU}
  if(t>=50&&t<60)for(let r=0;r<10+T*4;r++)ray(hx+12,hy-6,e['r'+r],(40+hash(r,7,1)*40)*k*(1-(t-50)/10),2.4,1.2,pi,1,.55);
  if(t>=50){const run=Math.min(1,(t-50)/38),x0=hx+14,front=x0+(300*k)*ease(run),half=(18+T*4);
   if(!e.em){e.em=[];const M=70+T*30;for(let q=0;q<M;q++){const r=Math.random();e.em.push({x:x0+Math.pow(r,.9)*300*k,y:hy+(Math.random()-.5)*2*half*(.95-.35*r),h:(16+T*5)*(.5+Math.random()*.8),w:2+Math.random()*1.8,s:Math.random()*50,pass:-1})}}
   for(let y=hy-half|0;y<=hy+half;y++){const dy=Math.abs(y-hy);for(let x=x0|0;x<front;x++){const lim=half*(.62+.4*fbm(x*.04,y*.02+e.seed));if(dy>lim)continue;const age=(t-50)-((x-x0)/(300*k))*38,life=clamp(1-age/70,0,1);if(life<=0)continue;{const fb=fbm(x*.09-f*.05,y*.2);if(fb>.42)add(x,y,(fb-.3)*.9*life*(1-dy/lim*.6),pi,0)}if(age<1.5){const dn=fbm(x*.08,y*.12);if(dn>.45)decal(x,y,dn,0)}heat(x,y-6,life*.8)}}
   for(const q of e.em){if(q.x>front)continue;if(q.pass<0)q.pass=t;const age=t-q.pass,life=clamp(1-age/(55+q.s*.4),0,1);if(life<=0)continue;const lead=Math.max(0,1-(front-q.x)/25);const h=q.h*(life*.85+lead*.6)*(.7+.5*fbm(q.s,f*.13));if(h>2)flame(q.x,q.y,h,q.w,.72*life+.22+lead*.3,1);if(Math.random()<.02*life)spark(q.x,q.y-h,(Math.random()-.5)*.3,-.7,26,pi,{size:Math.random()<.5?2:1})}
   light((x0+front)/2,hy,(front-x0)/2+40,pi,.45*(1-u*.6));
   hitArea(e.id,m=>m.x>x0&&m.x<front&&Math.abs(m.y-hy)<half,140*T,1.2,front-30,hy,{burn:1,pi:3})}break}
 case'lotus':{const px=hx+170*k,py=hy-6;
  if(t<18){const L=Math.min(1,t/6)*(px-hx-10),x0=hx+10,y0=hy-8;for(let s=0;s<L;s+=.5){const r=s/L,th=(r>.9?(1-r)*10:1)*(2.2+T*.4);for(let o=-th;o<=th;o+=.5){const jag=(hash(s|0,o*2|0,f)-.5)*.3;add(x0+s,y0+o*.7,(1.35-Math.abs(o)/th*.9+jag)*(1-t/22),pi,1)}}
   for(let i=0;i<3+T;i++)spark(x0+Math.random()*L,y0+(Math.random()-.5)*5,(Math.random()-.3)*2,(Math.random()-.5)*1.6,14+Math.random()*10,pi);
   if(t%3===0)spark(x0+Math.random()*L*.5,y0+(Math.random()-.5)*6,-.25,-.12,46,8,{size:2.5,puff:1,drag:.96});light(x0+L/2,y0,L/2+30,pi,.5);
   hitArea(e.id,m=>m.x>x0&&m.x<x0+L&&Math.abs(m.y-y0-6)<10,90*T,2,x0,y0)}
  if(t>=12){const v=t-12,dur=e.dur-12,uu=v/dur,R=(30+T*6)*ease(Math.min(1,v/14)),fade=uu>.7?(1-uu)/.3:1,rot=f*.12;
   field(px,py,R*1.25+4,.72,pi,1,(d,a,dx,dy,X,Y)=>{const rim=R*(.92+.18*fbm(Math.cos(a)*2+f*.05,Math.sin(a)*2));if(d>rim+3)return 0;const sw=.5+.5*Math.sin(a*3+d*.28-rot*3);let val=d<rim?.35+.45*sw*(d/rim)+(d<R*.25?.5:0):0;val=Math.max(val,Math.exp(-Math.pow((d-rim)/1.6,2))*1.35);for(let q=1;q<=2;q++)val=Math.max(val,Math.exp(-Math.pow((d-R*q*.33-(v%10))/1.1,2))*.85);return val*fade});
   for(let q=0;q<8;q++){const a=q/8*TAU+v*.03,pr=R*(.95+uu*.6),cx=px+Math.cos(a)*pr,cy=py+Math.sin(a)*pr*.72;field(cx,cy,7*k,.72,pi,1,(d,an)=>{const along=Math.cos(an-a);return d<6*k*(.55+.45*Math.abs(along))?(1.1-d/(6*k))*fade*1.1:0})}
   light(px,py,R*1.8,pi,.6*fade);if(v===2){shake=T>=3?6:3;for(let i=0;i<30+T*10;i++){const a=Math.random()*TAU,s=1+Math.random()*2.5;spark(px,py,Math.cos(a)*s,Math.sin(a)*s*.7,20+Math.random()*16,pi,{size:Math.random()<.3?2:1})}}
   if(v%14===2){e.id=idc++;hitArea(e.id,m=>Math.hypot(m.x-px,(m.y-py)/.72)<R*1.1,70*T,-.8,px,py)}}break}
